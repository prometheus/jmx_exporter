name: Manual Build
on: [workflow_dispatch]
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven
      - name: Validate formatting (Spotless)
        run: ./mvnw --batch-mode spotless:check
      - name: Build
        run: |
          ./integration_test_suite/pull-smoke-test-docker-images.sh
          JAVA_DOCKER_IMAGES=SMOKE PROMETHEUS_DOCKER_IMAGES=SMOKE ./mvnw --batch-mode clean install

  documentation:
    name: Build Documentation
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'
      - name: Build documentation
        run: ./scripts/build-documentation.sh
